{% extends "base.html" %}

<!-- content -->
{% block content %}
<section class="section-conten padding-y bg">
  {% include "includes/alerts.html" %}
  <div class="container">
    <div class="row">
      {% include "includes/dashboard_sidebar.html" %}
      <main class="col-md-9">
        <article class="card">
          <header class="card-header">
            <strong class="d-inline-block mr-1">Edit your profile</strong>
          </header>
          <div class="card-body">
            <div class="row align-items-stretch">
              <div class="col-md-12">
                <form action="" method="POST">
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="firstName">First Name</label>
                      <input
                        type="text"
                        name="first_name"
                        id="firstName"
                        class="form-control"
                      />
                    </div>
                    <div class="form-group col-md-6">
                      <label for="lastName">Last Name</label>
                      <input
                        type="text"
                        name="last_name"
                        id="lastName"
                        class="form-control"
                      />
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="phoneNumber">Phone number</label>
                      <input
                        type="text"
                        name="phone_number"
                        id="phoneNumber"
                        class="form-control"
                        pattern="^[0-9]{10}$"
                        title="Your phone number has an invalid format!"
                      />
                    </div>
                    <div class="form-group col-md-6">
                      <label for="picture">Picture</label>
                      <input
                        type="file"
                        name="picture"
                        id="picture"
                        class="form-control"
                      />
                    </div>
                  </div>
                  <div class="row">
                    <div class="form-group col-md-12">
                      <label for="addressLine1">Address line 1</label>
                      <input
                        type="text"
                        name="address_line_1"
                        id="addressLine1"
                        class="form-control"
                      />
                    </div>
                  </div>
                  <div class="row">
                    <div class="form-group col-md-12">
                      <label for="adressLine2">Address line 2</label>
                      <input
                        type="text"
                        name="address_line_2"
                        id="adressLine2"
                        class="form-control"
                      />
                    </div>
                  </div>
                  <div class="row">
                    <div class="form-group col-md-4">
                      <label for="city">City</label>
                      <input
                        type="text"
                        name="city"
                        id="city"
                        class="form-control"
                      />
                    </div>
                    <div class="form-group col-md-4">
                      <label for="state">State</label>
                      <input
                        type="text"
                        name="state"
                        id="state"
                        class="form-control"
                      />
                    </div>
                    <div class="form-group col-md-4">
                      <label for="country">Country</label>
                      <input
                        type="text"
                        name="country"
                        id="country"
                        class="form-control"
                      />
                    </div>
                  </div>
                  <button type="submit" class="btn btn-primary">
                    Save changes
                  </button>
                </form>
              </div>
            </div>
            <!-- row.// -->
          </div>
          <!-- card-body .// -->
        </article>
        <!-- order-group.// -->
      </main>
    </div>
    <!-- row.// -->
  </div>
</section>
{% endblock %}
