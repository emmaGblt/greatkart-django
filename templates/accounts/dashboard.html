{% extends "base.html" %}

<!-- content -->
{% block content %}
<section class="section-conten padding-y bg">
  {% include "includes/alerts.html" %}
  <div class="container">
    <div class="row">
      {% include "includes/dashboard_sidebar.html" %}
      <main class="col-md-9">
        <article class="card">
          <header class="card-header">
            <strong class="d-inline-block mr-1">Logged in as:</strong>
            <span>{{ user.full_name }}</span>
          </header>
          <div class="card-body">
            <div class="row align-items-stretch">
              <div class="col-md-6">
                <div class="card h-100">
                  <div
                    class="card-body text-center d-flex flex-column justify-content-center"
                  >
                    <h5 class="card-title">Total orders</h5>
                    <p class="h4">{{ orders_count }}</p>
                    <a href="{% url 'my-orders' %}">View orders</a>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card h-100">
                  <div class="card-body">
                    <img
                      src="https://www.w3schools.com/w3images/avatar6.png"
                      alt="User profile picture"
                      height="50"
                      width="50"
                      class="rounded-pill mb-3 mx-auto d-block"
                    />
                    <p class="mb-0">
                      <span class="font-weight-bold">Email: </span>
                      {{ user.email }}
                    </p>
                    <p>
                      <span class="font-weight-bold">Phone number: </span>
                      {{ user.phone_number }}
                    </p>
                  </div>
                </div>
              </div>
            </div>
            <!-- row.// -->
          </div>
          <!-- card-body .// -->
        </article>
        <!-- order-group.// -->
      </main>
    </div>
    <!-- row.// -->
  </div>
</section>
{% endblock %}
