{% extends "base.html" %} {% load static %}

<!-- content -->
{% block content %}
<section class="section-content padding-y bg">
  <div class="container">
    <!-- ============================ COMPONENT 1 ================================= -->
    <div class="row">
      <aside class="col-lg-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-4">Billing address</h4>
            <form action="">
              <div class="form-row">
                <div class="col form-group">
                  <label for="firstName">First Name</label>
                  <input
                    type="text"
                    name="first_name"
                    required
                    id="firstName"
                    class="form-control"
                  />
                </div>
                <div class="col form-group">
                  <label for="lastName">Last Name</label>
                  <input
                    type="text"
                    name="last_name"
                    required
                    id="lastName"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="form-row">
                <div class="col form-group">
                  <label for="email">Email</label>
                  <input
                    type="email"
                    name="email"
                    required
                    id="email"
                    class="form-control"
                  />
                </div>
                <div class="col form-group">
                  <label for="phoneNumber">Phone number</label>
                  <input
                    type="text"
                    name="phone_number"
                    required
                    id="phoneNumber"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="form-row">
                <div class="col form-group">
                  <label for="adressLine1">Adress line 1</label>
                  <input
                    type="text"
                    name="address_line_1"
                    required
                    id="adressLine1"
                    class="form-control"
                  />
                </div>
                <div class="col form-group">
                  <label for="adressLine2">
                    Adress line 2 <small>(optional)</small>
                  </label>
                  <input
                    type="text"
                    name="address_line_2"
                    id="adressLine2"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="form-row">
                <div class="col form-group">
                  <label for="city">City</label>
                  <input
                    type="text"
                    name="city"
                    required
                    id="city"
                    class="form-control"
                  />
                </div>
                <div class="col form-group">
                  <label for="state">State</label>
                  <input
                    type="text"
                    name="state"
                    required
                    id="state"
                    class="form-control"
                  />
                </div>
                <div class="col form-group">
                  <label for="country">Country</label>
                  <input
                    type="text"
                    name="country"
                    required
                    id="country"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="form-row">
                <label for="deliveryInformation">
                  Information de livraison <small>(optional)</small>
                </label>
                <textarea
                  name="delivery_infomration"
                  id="deliveryInformation"
                  class="form-control"
                  rows="2"
                />
              </div>
            </form>
          </div>
        </div>
        <!-- card.// -->
      </aside>
      <!-- col.// -->
      <aside class="col-lg-6">
        <div class="card">
          <div class="card-body">
            <table class="table table-borderless table-shopping-cart">
              <thead class="text-muted">
                <tr class="small text-uppercase">
                  <th scope="col">Product</th>
                  <th scope="col" width="120">Quantity</th>
                  <th scope="col" width="120">Price</th>
                  <th scope="col" class="text-right" width="200"></th>
                </tr>
              </thead>
              <tbody>
                {% for cart_item in cart_items %}
                <tr>
                  <td>
                    <figure class="itemside align-items-center">
                      <div class="aside">
                        <img
                          src="{{ cart_item.product.image.url }}"
                          class="img-sm"
                        />
                      </div>
                      <figcaption class="info">
                        <a
                          href="{{ cart_item.product.get_url }}"
                          class="title text-dark"
                        >
                          {{cart_item.product.name}}
                        </a>
                        <p class="text-muted small">
                          {% for variation in cart_item.variations.all %}
                          <!-- prettier-ignore -->
                          {{ variation.category | capfirst }}: {{ variation.value | capfirst }}
                          <br />
                          <!-- prettier-ignore -->
                          {% endfor %}
                        </p>
                      </figcaption>
                    </figure>
                  </td>
                  <td>
                    <!-- col.// -->
                    <div class="col">
                      <div class="input-group input-spinner">
                        <div class="input-group-prepend">
                          <a
                            href="{% url 'decrement-product-from-cart-item' cart_item.id %}"
                            class="btn btn-light"
                            type="button"
                            id="button-plus"
                          >
                            <i class="fa fa-minus"></i>
                          </a>
                        </div>
                        <input
                          type="text"
                          class="form-control"
                          value="{{ cart_item.quantity }}"
                        />
                        <div class="input-group-append">
                          <a
                            href="{% url 'increment-product-from-cart-item' cart_item.id %}"
                            class="btn btn-light"
                            type="button"
                            id="button-minus"
                          >
                            <i class="fa fa-plus"></i>
                          </a>
                        </div>
                      </div>
                      <!-- input-group.// -->
                    </div>
                    <!-- col.// -->
                  </td>
                  <td>
                    <div class="price-wrap">
                      <var class="price">${{ cart_item.total_price }}</var>
                      <small class="text-muted">
                        ${{ cart_item.product.price }} each
                      </small>
                    </div>
                    <!-- price-wrap .// -->
                  </td>
                  <td class="text-right">
                    <a
                      href="{% url 'delete-cart-item' cart_item.id %}"
                      class="btn btn-danger"
                      onclick="
                        return confirm(
                          'Are you sure you want to delete this item?',
                        );
                      "
                    >
                      Remove</a
                    >
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            <a href="./place-order.html" class="btn btn-primary btn-block">
              Order
            </a>
            <a href="{% url 'store' %}" class="btn btn-light btn-block"
              >Continue Shopping</a
            >
          </div>
          <!-- card-body.// -->
        </div>
        <!-- card.// -->
      </aside>
      <!-- col.// -->
    </div>
    <!-- row.// -->
    <!-- ============================ COMPONENT 1 END .// ================================= -->
  </div>
  <!-- container .//  -->
</section>
{% endblock %}
